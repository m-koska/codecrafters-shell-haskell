name: codecrafters-shell
version: 0.1.0.0
license: BSD3

default-extensions:
  - OverloadedStrings

dependencies:
  - base >= 4.19 && < 5
  - process
  - directory
  - filepath
  - text
  - unix
  - containers
  - exceptions
  - mtl
executables:
  codecrafters-shell-exe:
    main: Main.hs
    source-dirs:
      - app
      - src
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
